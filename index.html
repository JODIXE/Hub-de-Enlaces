<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB DE ENLACES MDP</title>
    <style>
        :root {
            --bg-page: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #e0e0e0;
            --accent: #00e5ff; /* Color Cian */
            --accent-glow: rgba(0, 229, 255, 0.35);
            --border: #333333;
            --input-bg: #2d2d2d;
            --input-text: #ffffff;
            --btn-open: #00e5ff;
            --btn-open-text: #000000;
            --btn-clear: #5a1a1a;
            --btn-clear-text: #ffcccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        h2.title {
            color: var(--accent);
            margin-top: 0;
            text-transform: uppercase;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--input-text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* Caja de Link */
        .reference-box {
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: rgba(0, 229, 255, 0.02);
        }

        /* Caja de Resultado con enlace cliqueable */
        .result-container {
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 18px;
            background-color: rgba(0, 229, 255, 0.04);
            margin-bottom: 20px;
            box-shadow: 0 0 12px var(--accent-glow);
            text-align: center;
        }

        .result-link {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.05rem;
            word-break: break-all;
            text-decoration: underline;
            cursor: pointer;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .result-link:hover {
            opacity: 0.8;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-open {
            background-color: var(--btn-open);
            color: var(--btn-open-text);
        }

        .btn-open:hover {
            opacity: 0.9;
        }

        .btn-clear {
            background-color: var(--btn-clear);
            color: var(--btn-clear-text);
        }

        .btn-clear:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2 class="title">HUB DE ENLACES MDP</h2>

        <!-- APARTADO 1: HERRAMIENTAS -->
        <div class="form-group">
            <label for="herramientas">HERRAMIENTAS</label>
            <select id="herramientas" onchange="cargarNombres()">
                <option value="">Seleccione Herramienta...</option>
                <option value="uso_diario">Uso Diario</option>
                <option value="looker">Looker</option>
                <option value="statuspage">Statuspage</option>
            </select>
        </div>

        <!-- APARTADO 2: NOMBRE DEL ENLACE -->
        <div class="form-group">
            <label for="nombreEnlace">NOMBRE DEL ENLACE</label>
            <select id="nombreEnlace" onchange="actualizarLink()">
                <option value="">Seleccione Nombre...</option>
            </select>
        </div>

        <!-- APARTADO 3: LINK -->
        <div class="reference-box">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="linkInput">LINK</label>
                <input type="text" id="linkInput" placeholder="Selecciona un enlace o escribe aquí..." oninput="actualizarResultadoManual()">
            </div>
        </div>

        <!-- APARTADO 4: ENLACE RESULTADO Y BOTONES -->
        <div class="result-container">
            <a id="resultLink" class="result-link" target="_blank" onclick="validarClicLink(event)">Seleccione las opciones para generar el link</a>
        </div>

        <div class="action-buttons">
            <button class="btn btn-open" onclick="abrirLink()">ABRIR LINK</button>
            <button class="btn btn-clear" onclick="limpiarCampos()">LIMPIAR</button>
        </div>
    </div>

    <script>
        /* BASE DE DATOS DE ENLACES PERSONALIZADA */
        const baseDeDatos = {
            "uso_diario": [
                { nombre: "DOTPANEL", url: "https://dotpanel.micasino.com/" },
                { nombre: "MICA.COM", url: "https://micasino.com/" },
                { nombre: "LIVE AGENT", url: "https://micasino.ladesk.com/agent/index.php#login" },
                { nombre: "NOMENCLATURA", url: "https://goatedxysen.github.io/Genrador-de-Nomenclaturas-MDP-/" }
            ],
            "looker": [
                { nombre: "Buscador de depósitos", url: "https://datastudio.google.com/reporting/942ba719-31c9-47b3-990c-b3e28436436b/page/MYYqD" },
                { nombre: "TXT", url: "https://datastudio.google.com/reporting/bd9f12d3-871c-44e6-9ef9-62f0fde41948/page/p_1yga8krpqd" },
                { nombre: "Retiros PagoFacil", url: "https://datastudio.google.com/reporting/f35792c6-94ee-4732-8995-431e196fd858/page/8oE5D" },
                { nombre: "Copia de RETIROS TXT", url: "https://datastudio.google.com/reporting/cad0cdb7-3c80-49b1-a4b3-1ac2c145f1db/page/a1GUF" }
            ],
            "statuspage": [
                { nombre: "D24", url: "https://status.d24.com/" },
                { nombre: "Monnet", url: "https://monnetpayments.status.freshservice.com/" },
                { nombre: "Paysafe Safetypay", url: "https://status.paysafe.com/#" },
                { nombre: "ALPS", url: "https://status.alps.cl/" },
                { nombre: "Transbank", url: "https://status.transbankdevelopers.cl/" },
                { nombre: "Etpay", url: "https://status.etpay.com/" },
                { nombre: "Kushki", url: "https://status.kushkipagos.com/" },
                { nombre: "Fintoc", url: "https://status.fintoc.com/" },
                { nombre: "Khipu", url: "https://status.khipu.com/" }
            ]
        };

        function cargarNombres() {
            const herramientaSeleccionada = document.getElementById('herramientas').value;
            const selectNombre = document.getElementById('nombreEnlace');
            
            selectNombre.innerHTML = '<option value="">Seleccione Nombre...</option>';
            document.getElementById('linkInput').value = '';
            
            const linkElem = document.getElementById('resultLink');
            linkElem.innerText = 'Seleccione las opciones para generar el link';
            linkElem.removeAttribute('href');

            if (herramientaSeleccionada && baseDeDatos[herramientaSeleccionada]) {
                baseDeDatos[herramientaSeleccionada].forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.url;
                    option.textContent = item.nombre;
                    selectNombre.appendChild(option);
                });
            }
        }

        function actualizarLink() {
            const urlSeleccionada = document.getElementById('nombreEnlace').value;
            const inputLink = document.getElementById('linkInput');
            const linkElem = document.getElementById('resultLink');

            if (urlSeleccionada) {
                inputLink.value = urlSeleccionada;
                linkElem.innerText = urlSeleccionada;
                linkElem.href = urlSeleccionada;
            } else {
                inputLink.value = '';
                linkElem.innerText = 'Seleccione las opciones para generar el link';
                linkElem.removeAttribute('href');
            }
        }

        function actualizarResultadoManual() {
            const textoManual = document.getElementById('linkInput').value.trim();
            const linkElem = document.getElementById('resultLink');
            
            if (textoManual) {
                const urlValida = (textoManual.startsWith('http://') || textoManual.startsWith('https://')) 
                    ? textoManual 
                    : 'https://' + textoManual;

                linkElem.innerText = textoManual;
                linkElem.href = urlValida;
            } else {
                linkElem.innerText = 'Seleccione las opciones para generar el link';
                linkElem.removeAttribute('href');
            }
        }

        function abrirLink() {
            const urlInput = document.getElementById('linkInput').value.trim();
            if (urlInput) {
                const urlValida = (urlInput.startsWith('http://') || urlInput.startsWith('https://')) 
                    ? urlInput 
                    : 'https://' + urlInput;
                window.open(urlValida, '_blank');
            } else {
                alert('Por favor, selecciona o escribe un enlace primero.');
            }
        }

        function validarClicLink(e) {
            const linkElem = document.getElementById('resultLink');
            if (!linkElem.hasAttribute('href')) {
                e.preventDefault();
                alert('Por favor, selecciona un enlace primero.');
            }
        }

        function limpiarCampos() {
            document.getElementById('herramientas').selectedIndex = 0;
            document.getElementById('nombreEnlace').innerHTML = '<option value="">Seleccione Nombre...</option>';
            document.getElementById('linkInput').value = '';
            
            const linkElem = document.getElementById('resultLink');
            linkElem.innerText = 'Seleccione las opciones para generar el link';
            linkElem.removeAttribute('href');
        }
    </script>
</body>
</html>
